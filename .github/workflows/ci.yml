name: EvoXRB validation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_full:
        description: "Run the opt-in full 12-epoch acceptance campaign"
        required: false
        default: false
        type: boolean

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest --cov=evoxrb --cov-report=term-missing

  full-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.run_full
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m evoxrb run-case-study --profile full --resume
      - run: python -m pytest -m "not full"
      - name: High-signal five-seed acceptance
        shell: pwsh
        run: |
          $env:EVOXRB_RUN_FULL = "1"
          python -m pytest tests/test_full_acceptance.py
      - uses: actions/upload-artifact@v4
        with:
          name: evoxrb-full-case-study
          path: |
            results/*.csv
            results/*.json
            figures/generated/*.png
            reports/generated/*.md
